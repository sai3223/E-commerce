<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; text-align: center; }
    header { background: #222; color: #fff; padding: 15px; }
    form { background: #fff; width: 350px; margin: 30px auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.2); }
    input { display: block; width: 90%; margin: 10px auto; padding: 10px; }
    button { padding: 10px 20px; background: #007BFF; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Payment Details</h1>
  </header>
  <form onsubmit="completePurchase(event)">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Address" required>
    <input type="text" placeholder="Card Number" required>
    <input type="text" placeholder="CVV" required>
    <button type="submit">Pay Now</button>
  </form>

  <script>
    function completePurchase(e) {
      e.preventDefault();
      localStorage.removeItem("cart");
      window.location.href = "thankyou.html";
    }
  </script>
</body>
</html>
